<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Login - Healthcare Management System
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        body {
            background: #f4f7fb;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }


        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }


        .login-card {
            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.12);

            text-align: center;
        }


        .login-icon {
            font-size: 55px;
            margin-bottom: 10px;
        }


        .login-card h1 {
            color: #0d6efd;
            margin-bottom: 8px;
        }


        .login-card p {
            color: #666;
            margin-bottom: 25px;
        }


        .login-card form {
            text-align: left;
        }


        .login-card button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            font-size: 16px;
        }


        .error-message {
            background: #ffe5e5;
            color: #d00000;

            padding: 10px;

            border-radius: 7px;

            margin-bottom: 15px;

            text-align: center;
        }


        .login-info {
            margin-top: 20px;

            padding: 12px;

            background: #f1f6ff;

            border-radius: 8px;

            font-size: 14px;

            color: #555;
        }

    </style>

</head>


<body>


    <div class="login-container">


        <div class="login-card">


            <div class="login-icon">
                🏥
            </div>


            <h1>
                Healthcare System
            </h1>


            <p>
                Login to your account
            </p>



            <!-- ================= ERROR ================= -->

            {% if error %}

                <div class="error-message">

                    {{ error }}

                </div>

            {% endif %}



            <!-- ================= LOGIN FORM ================= -->

            <form
                action="/login"
                method="POST"
            >


                <label>
                    Username
                </label>


                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >



                <label>
                    Password
                </label>


                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >



                <button type="submit">
                    🔐 Login
                </button>


            </form>



            <!-- ================= DEMO LOGIN ================= -->

            <div class="login-info">

                <strong>
                    Demo Login
                </strong>

                <br><br>

                Username:
                <strong>
                    Mohd Monis
                </strong>

                <br>

                Password:
                <strong>
                    @805757
                </strong>

            </div>


        </div>


    </div>


</body>

</html>
