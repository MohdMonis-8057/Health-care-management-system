<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Edit Doctor
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


    <!-- ================= NAVIGATION ================= -->

    <nav>

        <div class="logo">
            🏥 Healthcare System
        </div>


        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/patients">
                Patients
            </a>

            <a href="/doctors">
                Doctors
            </a>

            <a href="/appointments">
                Appointments
            </a>

            <a href="/logout">
                🚪 Logout
            </a>

        </div>

    </nav>



    <!-- ================= HEADER ================= -->

    <header>

        <h1>
            ✏️ Edit Doctor
        </h1>

        <p>
            Update Doctor Information
        </p>

    </header>



    <!-- ================= MAIN ================= -->

    <main>


        <div class="card">

            <h2>
                👨‍⚕️ Doctor Details
            </h2>


            <form
                action="/edit_doctor/{{ doctor['id'] }}"
                method="POST"
            >


                <!-- ================= NAME ================= -->

                <label>
                    Doctor Name
                </label>


                <input
                    type="text"
                    name="name"
                    value="{{ doctor['name'] }}"
                    placeholder="Enter doctor name"
                    required
                >



                <!-- ================= SPECIALIZATION ================= -->

                <label>
                    Specialization
                </label>


                <input
                    type="text"
                    name="specialization"
                    value="{{ doctor['specialization'] }}"
                    placeholder="e.g. Cardiologist"
                    required
                >



                <!-- ================= PHONE ================= -->

                <label>
                    Phone Number
                </label>


                <input
                    type="tel"
                    name="phone"
                    value="{{ doctor['phone'] }}"
                    placeholder="Enter phone number"
                    required
                >



                <!-- ================= DEPARTMENT ================= -->

                <label>
                    Department
                </label>


                <input
                    type="text"
                    name="department"
                    value="{{ doctor['department'] }}"
                    placeholder="e.g. Cardiology"
                    required
                >



                <!-- ================= BUTTONS ================= -->

                <button type="submit">
                    💾 Update Doctor
                </button>


                <a href="/doctors">

                    <button
                        type="button"
                    >
                        ❌ Cancel
                    </button>

                </a>

            </form>

        </div>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 Healthcare Management System
        </p>

    </footer>


</body>

</html>
